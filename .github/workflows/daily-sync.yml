name: Daily Sync

on:
  schedule:
    # Run every 6 hours (4x daily): 12 AM, 6 AM, 12 PM, 6 PM UTC
    # In MST: 5 PM, 11 PM, 5 AM, 11 AM
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI
    inputs:
      skip_thumbnails:
        description: 'Skip thumbnail processing (faster sync)'
        type: boolean
        default: false
      allow_mass_orphan:
        description: 'Allow trashing a large number of missing assets (only for a real bulk deletion)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run — read everything, write nothing; the planned changes are uploaded as an artifact'
        type: boolean
        default: false

permissions:
  id-token: write   # Required for WIF OIDC token
  contents: read

# Never run two syncs at once (cron + manual trigger): overlapping runs double
# Drive/Gemini spend and race each other's orphan detection. A queued run waits
# for the active one rather than cancelling it mid-write.
concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Thumbnails are time-boxed (SYNC_THUMBNAIL_BUDGET_MIN, default 15) so the
    # upsert/orphan/embed steps always get to run. Keep this under 60: the
    # Google access token is fetched once and lasts an hour.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Requires these GitHub Actions repository variables (Settings → Variables):
      #   GCP_PROJECT_NUMBER          — your GCP project number
      #   GCP_WIF_POOL_ID             — Workload Identity Pool ID
      #   GCP_WIF_PROVIDER_ID         — Workload Identity Provider ID
      #   GCP_SERVICE_ACCOUNT_EMAIL   — service account email
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ vars.GCP_WIF_POOL_ID }}/providers/${{ vars.GCP_WIF_PROVIDER_ID }}'
          service_account: '${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Only connection credentials are needed as secrets.
      # Operational config (shared_drive_id, sync_folders, drive_label_id, etc.)
      # is loaded from the Supabase app_settings table by the sync script.
      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ inputs.skip_thumbnails }}" = "true" ]; then
            FLAGS="$FLAGS --skip-thumbnails"
          fi
          if [ "${{ inputs.allow_mass_orphan }}" = "true" ]; then
            FLAGS="$FLAGS --allow-mass-orphan"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run --dry-run-out=sync-plan.json"
          fi
          npx tsx scripts/sync.ts $FLAGS

      # Failed, cancelled or timed-out runs: make sure the run is recorded in
      # sync_logs (the sync's own crash handler can't run if the job is
      # killed). No-op if the sync already wrote a row for this run.
      - name: Record failed run
        if: ${{ (failure() || cancelled()) && !inputs.dry_run }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: npx tsx scripts/record-sync-failure.ts

      # Dry runs only: the planned changes, for review or for diffing two
      # versions of the sync against the same data. Contains asset metadata —
      # kept briefly, and only in this (private) repository.
      - name: Upload dry-run plan
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-plan-${{ github.sha }}
          path: sync-plan.json
          retention-days: 3
